# Fresh AlphaZero-style UTTT probe: latest network always generates self-play.
game: uttt
depth: 6
channels: 24
kernel_size: 5
dense_net: true
uttt_hierarchical: true
head_channels: 48
head_pool: true
v_head_convs: 0
pi_head_convs: 0
v_fc_layers: 1
pi_fc_layers: 0
uttt_policy_head: flat
uttt_destination_context: false
uttt_macro_channels: -1
uttt_macro_transformer_layers: 2
uttt_macro_transformer_heads: 4
uttt_macro_transformer_ff_mult: 4.0
uttt_macro_transformer_dropout: 0.0
trunk_norm: batch
weight_decay: 0.0001
optimizer: sgd
trunk_act: relu
orth_reg_lambda: 0.0

cpuct: 1.25
fpu_reduction: 0.25
mcts_root_temp: 1.25
root_fpu_zero: true
shaped_dirichlet: true
policy_target_pruning: true
selfplay_mcts_visits: 512
fast_mcts_visits: 32
compare_mcts_visits: 128
playout_cap_percent: 0.75
gumbel_enabled: true
gumbel_m: 32
gumbel_c_visit: 50.0
gumbel_c_scale: 1.0
gumbel_full: false
fast_search_algo: puct

self_play_temp: 1.0
eval_temp: 0.5
final_temp: 0.2
temp_decay_half_life: 10
self_play_batch_size: 256
self_play_concurrent_batch_mult: 2
self_play_chunks: 1
selfplay_use_latest: true

train_batch_size: 1024
train_sample_rate: 4
lr: 0.022
cv: 1.5
lr_schedule: adaptive
lr_drop_factor: 0.7
lr_patience: 20
lr_min_iter: 50
lr_min_between_drops: 35
lr_max_drops: 5
lr_warmup_target: 15
lr_warmup_floor: 0.2
value_target: final
policy_loss: cross_entropy

gating_enabled: false
gating_panel_size: 1
gating_panel_win_rate: 0.52
gating_best_win_rate: 0.52
iterations: 40
compare_past: []
elo_enabled: false
whr_enabled: false

hist_size: 60000
window_size_unit: iterations
window_size_alpha: 0.5
window_size_beta: 0.7
window_size_scalar: 6.0
window_size_scalar_games: 4400
max_cache_size: 200000
cache_shards: -1
result_workers: 2
data_workers: -1
streaming_active_files: 8
resign_percent: 0.0
resign_playthrough_percent: 0.2
reservoir_recency_decay: 0.995
reservoir_n_chunks: 100
reservoir_chunk_size: 100000
reservoir_chunks_per_update: 10
reservoir_update_interval: 10

amp_inference: true
half_storage: true
torch_compile: false
ema_averaging: true
zstd_level: 1
loader_threads: -1

frozen_eval_anchor_iters: []
selfmatch_visit_multiplier: 0
effective_rank_enabled: true
effective_rank_batch_size: 512

uttt_ai_eval_interval: 1
uttt_ai_eval_games: 256
uttt_ai_eval_temperature: 0.0
uttt_ai_eval_opening_plies: 6
uttt_ai_eval_opening_seed: 0
uttt_ai_eval_model: ''
uttt_ai_eval_require_cuda: true
uttt_ai_select_best: true
